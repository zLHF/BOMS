server:
  port: 8081   # 8080 已被 yunqian-backend 占用

spring:
  application:
    name: boms-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/boms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: boms
    password: boms_pw
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # 09/10 含 MySQL 8 语法（JSON、utf8mb4_0900_ai_ci），用 mysql 方言执行
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 需核对租户拦截器追加的 SQL 时，取消下一行注释：
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 阶段 0 鉴权基座配置
boms:
  jwt:
    # 演示密钥；生产用环境变量注入，勿入库
    secret: "boms-phase0-demo-secret-key-change-me-in-prod-0123456789"
    expire-minutes: 720
  demo:
    # 演示账号种子里 password_hash 为占位，阶段 0 放行明文 123456 登录；接入真实 bcrypt 后置 false
    allow-plain-password: true
    plain-password: "123456"

logging:
  level:
    com.boms: debug
