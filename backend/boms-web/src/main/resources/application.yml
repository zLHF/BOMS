server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: boms-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/boms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:boms}
    password: ${SPRING_DATASOURCE_PASSWORD:boms_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # 09/10 含 MySQL 8 语法（JSON、utf8mb4_0900_ai_ci），用 mysql 方言执行
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 需核对租户拦截器追加的 SQL 时，取消下一行注释：
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 阶段 0 鉴权基座配置
boms:
  jwt:
    # 演示密钥；生产用环境变量注入，勿入库
    secret: ${BOMS_JWT_SECRET:boms-phase0-demo-secret-key-change-me-in-prod-0123456789}
    expire-minutes: ${BOMS_JWT_EXPIRE_MINUTES:720}
  demo:
    # 演示账号种子里 password_hash 为占位，阶段 0 放行明文 123456 登录；接入真实 bcrypt 后置 false
    allow-plain-password: ${BOMS_DEMO_ALLOW_PLAIN_PASSWORD:true}
    plain-password: ${BOMS_DEMO_PLAIN_PASSWORD:123456}

  # MinIO 附件存储
  minio:
    endpoint: ${BOMS_MINIO_ENDPOINT:http://127.0.0.1:9100}
    access-key: ${BOMS_MINIO_ACCESS_KEY:boms}
    secret-key: ${BOMS_MINIO_SECRET_KEY:boms_minio_pw}
    bucket: ${BOMS_MINIO_BUCKET:boms-files}

  # 批量导入限制，默认 10MiB，生产可按网关/业务容量调整
  import:
    max-file-size-bytes: ${BOMS_IMPORT_MAX_FILE_SIZE_BYTES:10485760}

  # 算力平台对接（默认关闭；enabled=true 才启用 SSO/心跳，并开启每 5 分钟心跳定时任务）
  # gateway/app-key/app-secret 由算力平台分配，生产用环境变量注入，勿入库
  cpn:
    enabled: ${BOMS_CPN_ENABLED:false}
    gateway: ${BOMS_CPN_GATEWAY:}
    app-key: ${BOMS_CPN_APP_KEY:}
    app-secret: ${BOMS_CPN_APP_SECRET:}
    heartbeat-cron: ${BOMS_CPN_HEARTBEAT_CRON:0 */5 * * * ?}

logging:
  level:
    com.boms: ${LOGGING_LEVEL_COM_BOMS:INFO}
